name: deploy-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Cloudflare identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9dc502d4ef06b3b5374591de6e6933ca"
        run: |
          set -euo pipefail
          npx wrangler whoami
      - name: Deploy putduk-web to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9dc502d4ef06b3b5374591de6e6933ca"
          CLOUDFLARE_ZONE_ID: "c9e6c93451c3c2e107a1eca511bedaba"
        run: pnpm deploy
      - name: Switch public PUTDUK domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9dc502d4ef06b3b5374591de6e6933ca"
          CLOUDFLARE_ZONE_ID: "c9e6c93451c3c2e107a1eca511bedaba"
        run: node scripts/cf-attach-custom-domains.mjs
      - name: Public customer smoke
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 2 --retry-connrefused https://putduk.com/ > /tmp/putduk.html
          grep -q "퍼뜩" /tmp/putduk.html
          ! grep -qi "AI Profit OS" /tmp/putduk.html
          curl -fsSL --retry 8 --retry-delay 2 --retry-connrefused https://www.putduk.com/ > /tmp/putduk-www.html
          grep -q "퍼뜩" /tmp/putduk-www.html
          ! grep -qi "AI Profit OS" /tmp/putduk-www.html
