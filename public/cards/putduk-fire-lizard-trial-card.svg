<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 744 1039" role="img" aria-labelledby="title desc">
  <title id="title">퍼뜩 체험 카드 — 오리지널 불꽃 도마뱀</title>
  <desc id="desc">기존 캐릭터를 복제하지 않은 오리지널 주황색 불꽃 도마뱀 체험 카드</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="0.55" stop-color="#ffe0a8"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5c35"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#692b16" flood-opacity="0.24"/>
    </filter>
    <clipPath id="artClip"><rect x="44" y="164" width="656" height="594" rx="28"/></clipPath>
  </defs>

  <rect x="16" y="16" width="712" height="1007" rx="42" fill="#351a16" filter="url(#shadow)"/>
  <rect x="28" y="28" width="688" height="983" rx="34" fill="url(#cardBg)" stroke="#ffd97d" stroke-width="5"/>
  <path d="M28 62Q28 28 62 28h620q34 0 34 34v98H28z" fill="url(#band)"/>
  <circle cx="78" cy="94" r="28" fill="#fff1c7" opacity="0.96"/>
  <path d="M68 94h20M78 84v20" stroke="#ff6339" stroke-width="7" stroke-linecap="round"/>
