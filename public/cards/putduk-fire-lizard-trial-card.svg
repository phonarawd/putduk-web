  <text x="122" y="119" fill="#ffe7bc" font-family="Pretendard, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">FIRE TRAIL · ORIGINAL MASCOT</text>
  <text x="666" y="103" text-anchor="end" fill="#fffaf0" font-family="Pretendard, Arial, sans-serif" font-size="19" font-weight="700">TRIAL</text>

  <rect x="44" y="164" width="656" height="594" rx="28" fill="#64251a"/>
  <g clip-path="url(#artClip)">
    <image x="-20" y="134" width="808" height="808" preserveAspectRatio="xMidYMid slice" href="fire-lizard.png" xlink:href="fire-lizard.png"/>
    <rect x="44" y="164" width="656" height="594" fill="#ff8a3d" opacity="0.07"/>
  </g>
  <rect x="44" y="164" width="656" height="594" rx="28" fill="none" stroke="#fff0c9" stroke-opacity="0.8" stroke-width="4"/>

  <text x="56" y="818" fill="#8e3b1d" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1">PUTDUK ORIGINAL</text>
  <text x="56" y="870" fill="#3a1b16" font-family="Pretendard, Arial, sans-serif" font-size="42" font-weight="900">불꽃 꼬리 루미</text>
  <text x="56" y="904" fill="#75452e" font-family="Pretendard, Arial, sans-serif" font-size="19" font-weight="600">따뜻한 불씨로 첫 경험을 밝혀주는 안내자</text>

  <rect x="56" y="936" width="204" height="42" rx="21" fill="#fffaf0" opacity="0.88"/>
  <text x="158" y="964" text-anchor="middle" fill="#b44926" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="800">체험 전용</text>
  <text x="682" y="964" text-anchor="end" fill="#8e3b1d" font-family="Pretendard, Arial, sans-serif" font-size="18" font-weight="800">No. 001</text>
